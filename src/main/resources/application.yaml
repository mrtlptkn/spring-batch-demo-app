spring:
  application:
    name: spring-batch-demo-app
  datasource:
    url: jdbc:h2:file:./data/batchdb;AUTO_SERVER=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: true
  batch:
    job:
      enabled: false # Job'ları açılışta otomatik çalıştırma; biz controller/runner ile başlatıyoruz
    jdbc:
      initialize-schema: ALWAYS #veri tabanı tablolarını kendisi generate eder
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/orders.sql,classpath:sql/non-critical-products.sql

batch:
  reject-threshold: 5   # Bu sayıdan fazla kayıt atlanırsa kredi kontrolü yapılmaz
  input-dir: ./data/input
  output-dir: ./data/output
  archive-dir: ./data/archive