spring:
  application:
    name: spring-batch-demo-app
  datasource:
    url: jdbc:h2:file:./data/batchdb;AUTO_SERVER=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: true
  batch:
    job:
      enabled: false # Job'ları açılışta otomatik çalıştırma; biz controller/runner ile başlatıyoruz
    jdbc:
      initialize-schema: ALWAYS #veri tabanı tablolarını kendisi generate eder